<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B2B Peer</title>
  <link rel="stylesheet" href="/app.css">
  <script defer src="/app.js"></script>
  <script defer src="/workspace.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">B</span><div><strong>B2B Peer</strong><small>Scenario × ALM</small></div></div>
      <nav aria-label="주 메뉴">
        <button class="nav-item active" data-view="overview"><span>◫</span> 홈</button>
        <button class="nav-item" data-view="scenario_prd"><span>◈</span> 시나리오 PRD 충돌 분석</button>
        <button class="nav-item" data-view="prd_prd"><span>◇</span> PRD 충돌 분석</button>
        <button class="nav-item" data-view="interpret"><span>◉</span> PRD 해석</button>
        <button class="nav-item" data-view="library"><span>▤</span> 문서 라이브러리</button>
        <button class="nav-item" data-view="knowledge"><span>◇</span> 지식베이스 <small>Beta</small></button>
      </nav>
      <div class="sidebar-bottom"><div class="local-dot"></div><div><strong>로컬 워크스페이스</strong><small>이 컴퓨터에서만 실행</small></div></div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="crumb">WORKSPACE <span>/</span> LG Business Cloud 3.0 <span>/</span> <b id="crumb-current">홈</b></div><div class="top-right"><span class="sync-pill"><i></i> Local sync</span><span class="avatar">UX</span></div></header>
      <main id="content"><div class="loading">데이터를 불러오는 중입니다…</div></main>
    </div>
  </div>
  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true" aria-label="원본 페이지 뷰어">
    <div class="viewer-head"><div><span class="eyebrow">SOURCE VIEWER</span><h2 id="viewer-title">원본 페이지</h2><p id="viewer-meta"></p></div><div class="viewer-actions"><button class="icon-button" id="viewer-prev" aria-label="이전 페이지">←</button><span id="viewer-page"></span><button class="icon-button" id="viewer-next" aria-label="다음 페이지">→</button><button class="icon-button close" id="viewer-close" aria-label="닫기">×</button></div></div>
    <div id="viewer-body" class="viewer-body"></div>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
</body>
</html>
